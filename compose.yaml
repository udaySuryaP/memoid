name: memoid-foundation
services:
  postgres:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: memoid
      POSTGRES_USER: memoid_admin
      POSTGRES_PASSWORD: synthetic-admin-password
    ports: ["5432:5432"]
    volumes:
      - memoid_pg:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memoid_admin -d memoid"]
      interval: 3s
      timeout: 3s
      retries: 20
  postgres-test:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: memoid_test
      POSTGRES_USER: memoid_admin
      POSTGRES_PASSWORD: synthetic-admin-password
    ports: ["5433:5432"]
    volumes:
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memoid_admin -d memoid_test"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  memoid_pg:
